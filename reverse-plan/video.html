<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>逆向財務工程｜75 秒動畫</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@500;700;900&family=Roboto:wght@500;700&display=swap">
<style>
  :root { color-scheme: light; --bg: #E9E1CF; --ink: #1E2A47; --mute: #56607A; --coral: #E8634F; }
  html, body { height: 100%; margin: 0; background: var(--bg); color: var(--ink); font-family: "Noto Sans TC", sans-serif; }
  body { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding-block: 12px; box-sizing: border-box; }
  canvas { height: calc(100% - 64px); max-width: calc(100vw - 32px); aspect-ratio: 9 / 16; object-fit: contain; border-radius: 8px; box-shadow: 0 10px 30px rgba(30,42,71,.22); }
  .bar { display: flex; gap: 10px; align-items: center; width: min(560px, calc(100vw - 32px)); }
  button { font: inherit; font-weight: 700; background: var(--ink); color: #FFFCF5; border: 0; border-radius: 6px; padding: 6px 14px; cursor: pointer; }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--coral); outline-offset: 2px; }
  input[type=range] { flex: 1; accent-color: var(--coral); }
  output { font-variant-numeric: tabular-nums; color: var(--mute); min-width: 4.5em; text-align: right; }
  body.render { padding: 0; display: block; }
  body.render canvas { width: 1080px; height: 1920px; max-width: none; border-radius: 0; box-shadow: none; display: block; }
  body.render .bar { display: none; }
</style>
</head>
<body>
<canvas id="stage" width="1080" height="1920"></canvas>
<div class="bar">
  <button id="play" type="button">暫停</button>
  <button id="restart" type="button">重播</button>
  <input id="scrub" type="range" min="0" max="75" step="0.01" value="0" aria-label="時間軸">
  <output id="time">0.0 秒</output>
</div>
<script>
(function () {
  'use strict';
  const Q = new URLSearchParams(location.search);
  const CLEAN = Q.has('clean');                 // 無字版：所有字卡、數字都不畫，留給後製
  const ctx = document.getElementById('stage').getContext('2d');
  const W = 1080, H = 1920;

  const C = {
    paper: '#F6EFE0', fleck: '#DCCFB4', navy: '#1E2A47', mute: '#5D6680', yellow: '#F2B134',
    ysoft: '#FBE3A6', coral: '#E8634F', white: '#FFFCF5', line: '#9AA6BA', water: '#C9D3E3'
  };
  const FONT = '"Roboto","Noto Sans TC",sans-serif';

  // ---------- 小工具 ----------
  const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
  const lerp = (a, b, k) => a + (b - a) * k;
  const seg = (t, a, b) => clamp((t - a) / (b - a));
  const eo = (x) => 1 - Math.pow(1 - x, 3);
  const ei = (x) => x * x * x;
  const eio = (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
  const back = (x) => { const c1 = 1.9, c3 = c1 + 1; return x <= 0 ? 0 : x >= 1 ? 1 : 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
  const fmt = (n) => Math.round(n).toLocaleString('en-US');
  function rand(seed) { const s = Math.sin(seed * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); }

  function rr(x, y, w, h, r) {
    r = Math.min(r, w / 2, h / 2);
    ctx.beginPath();
    ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
  }
  // 編輯插畫風的卡片：深藍描邊＋平面錯位陰影
  function box(x, y, w, h, r, fill = C.white, o = {}) {
    if (o.sh !== false) { ctx.save(); ctx.globalAlpha *= 0.16; ctx.fillStyle = C.navy; rr(x + 9, y + 11, w, h, r); ctx.fill(); ctx.restore(); }
    rr(x, y, w, h, r); ctx.fillStyle = fill; ctx.fill();
    if (o.lw !== 0) { ctx.lineWidth = o.lw || 4; ctx.strokeStyle = o.stroke || C.navy; ctx.stroke(); }
  }
  function T(str, x, y, o = {}) {
    if (CLEAN) return;
    ctx.save();
    ctx.globalAlpha *= (o.a == null ? 1 : o.a);
    ctx.font = `${o.w || 700} ${o.s || 40}px ${FONT}`;
    ctx.fillStyle = o.c || C.navy;
    ctx.textAlign = o.al || 'left';
    ctx.textBaseline = o.bl || 'alphabetic';
    ctx.fillText(str, x, y);
    ctx.restore();
  }
  function tw(str, s, w = 700) { ctx.save(); ctx.font = `${w} ${s}px ${FONT}`; const m = ctx.measureText(str).width; ctx.restore(); return m; }

  // 標題字卡：逐行上滑出場，t1 前淡出；hl 會在字下刷一道黃色
  function caption(lt, t0, t1, lines, y = 300, x = 110) {
    if (CLEAN) return;
    const out = t1 == null ? 1 : 1 - seg(lt, t1 - 0.3, t1);
    if (out <= 0) return;
    let yy = y;
    lines.forEach((L, i) => {
      const s = L.s || 84;
      yy += s * (L.lh || 1.22);
      const k = t0 < 0 ? 1 : eo(seg(lt, t0 + i * 0.1, t0 + i * 0.1 + 0.45));
      if (k <= 0) return;
      const dy = (1 - k) * 34;
      if (L.hl) {
        const p = t0 < 0 ? 1 : eio(seg(lt, t0 + 0.55, t0 + 1.0));
        ctx.save(); ctx.globalAlpha *= out * k; ctx.fillStyle = C.yellow;
        ctx.fillRect(x - 8, yy + dy - s * 0.38, (tw(L.t, s, L.w || 900) + 16) * p, s * 0.42);
        ctx.restore();
      }
      T(L.t, x, yy + dy, { s, w: L.w || 900, c: L.c || C.navy, a: out * k });
    });
  }
  function foot(lt, t0, str, y = 1612) { T(str, 110, y, { s: 30, w: 500, c: C.mute, a: eo(seg(lt, t0, t0 + 0.5)) }); }
  function step(lt, t0, str) { T(str, 110, 268, { s: 40, w: 700, c: C.coral, a: eo(seg(lt, t0, t0 + 0.4)) }); }

  // 平滑路徑（Catmull-Rom 取樣），可依比例畫出一段
  function curve(pts, n = 36) {
    const out = [];
    for (let i = 0; i < pts.length - 1; i++) {
      const p0 = pts[i - 1] || pts[i], p1 = pts[i], p2 = pts[i + 1], p3 = pts[i + 2] || p2;
      for (let j = 0; j < n; j++) {
        const s = j / n, s2 = s * s, s3 = s2 * s;
        const f = (a, b, c, d) => 0.5 * (2 * b + (-a + c) * s + (2 * a - 5 * b + 4 * c - d) * s2 + (-a + 3 * b - 3 * c + d) * s3);
        out.push({ x: f(p0.x, p1.x, p2.x, p3.x), y: f(p0.y, p1.y, p2.y, p3.y) });
      }
    }
    out.push(pts[pts.length - 1]);
    let L = 0; out[0].d = 0;
    for (let i = 1; i < out.length; i++) { L += Math.hypot(out[i].x - out[i - 1].x, out[i].y - out[i - 1].y); out[i].d = L; }
    out.L = L;
    return out;
  }
  // 從 a 到 b（0–1 的長度比例）畫一段；回傳筆尖位置與方向
  function trace(P, a, b) {
    if (b <= a) return null;
    const A = a * P.L, B = b * P.L;
    ctx.beginPath();
    let started = false, tip = null;
    for (let i = 1; i < P.length; i++) {
      const p = P[i - 1], q = P[i];
      if (q.d < A) continue;
      if (p.d > B) break;
      const k0 = clamp((A - p.d) / (q.d - p.d || 1)), k1 = clamp((B - p.d) / (q.d - p.d || 1));
      const sx = lerp(p.x, q.x, k0), sy = lerp(p.y, q.y, k0);
      if (!started) { ctx.moveTo(sx, sy); started = true; }
      const ex = lerp(p.x, q.x, k1), ey = lerp(p.y, q.y, k1);
      ctx.lineTo(ex, ey);
      tip = { x: ex, y: ey, ang: Math.atan2(q.y - p.y, q.x - p.x) };
    }
    ctx.stroke();
    return tip;
  }
  function arrowHead(x, y, ang, s, col) {
    ctx.save(); ctx.translate(x, y); ctx.rotate(ang); ctx.fillStyle = col;
    ctx.beginPath(); ctx.moveTo(s, 0); ctx.lineTo(-s * 0.7, -s * 0.75); ctx.lineTo(-s * 0.35, 0); ctx.lineTo(-s * 0.7, s * 0.75); ctx.closePath(); ctx.fill();
    ctx.restore();
  }

  // ---------- 圖示（全部用線條畫，不含任何字） ----------
  function icon(name, cx, cy, s, o = {}) {
    ctx.save();
    ctx.translate(cx, cy);
    ctx.lineWidth = Math.max(3, s * 0.055); ctx.lineJoin = 'round'; ctx.lineCap = 'round';
    ctx.strokeStyle = C.navy;
    const acc = o.acc || C.yellow;
    const P = (pts) => { ctx.beginPath(); pts.forEach(([x, y], i) => (i ? ctx.lineTo(x * s, y * s) : ctx.moveTo(x * s, y * s))); };
    const fs = (fill) => { ctx.fillStyle = fill; ctx.fill(); ctx.stroke(); };
    switch (name) {
      case 'bag':
        P([[-.32, -.1], [.32, -.1], [.38, .42], [-.38, .42]]); ctx.closePath(); fs(acc);
        ctx.beginPath(); ctx.arc(0, -.1 * s, .17 * s, Math.PI, 0); ctx.stroke(); break;
      case 'coin':
        ctx.beginPath(); ctx.arc(.08 * s, .06 * s, .36 * s, 0, 7); fs(C.white);
        ctx.beginPath(); ctx.arc(-.06 * s, -.06 * s, .36 * s, 0, 7); fs(acc);
        ctx.beginPath(); ctx.arc(-.06 * s, -.06 * s, .22 * s, 0, 7); ctx.stroke(); break;
      case 'chart':
        [[-.3, .2], [-.06, .02], [.18, -.2]].forEach(([x, top]) => { rr(x * s, top * s, .18 * s, (.4 - top) * s, 3); fs(acc); });
        P([[-.42, -.42], [-.42, .4], [.44, .4]]); ctx.stroke();
        P([[-.3, -.08], [-.02, -.24], [.16, -.36], [.36, -.46]]); ctx.strokeStyle = C.coral; ctx.stroke(); break;
      case 'toolbox':
        rr(-.42 * s, -.12 * s, .84 * s, .52 * s, 6); fs(acc);
        rr(-.17 * s, -.32 * s, .34 * s, .2 * s, 5); ctx.stroke();
        P([[-.42, .08], [.42, .08]]); ctx.stroke();
        rr(-.07 * s, .02 * s, .14 * s, .12 * s, 2); fs(C.white); break;
      case 'house':
        P([[-.36, -.02], [-.36, .4], [.36, .4], [.36, -.02]]); ctx.stroke();
        P([[-.46, .02], [0, -.4], [.46, .02]]); ctx.closePath(); fs(acc);
        rr(-.1 * s, .14 * s, .2 * s, .26 * s, 3); fs(C.white); break;
      case 'ring': {
        for (let i = 0; i < 4; i++) {
          ctx.beginPath(); ctx.arc(0, 0, .37 * s, i * Math.PI / 2, (i + 1) * Math.PI / 2);
          ctx.lineWidth = .18 * s; ctx.strokeStyle = i % 2 ? C.white : C.coral; ctx.lineCap = 'butt'; ctx.stroke();
        }
        ctx.lineWidth = Math.max(3, s * 0.05); ctx.strokeStyle = C.navy;
        ctx.beginPath(); ctx.arc(0, 0, .46 * s, 0, 7); ctx.stroke();
        ctx.beginPath(); ctx.arc(0, 0, .28 * s, 0, 7); ctx.stroke(); break;
      }
      case 'sprout':
        P([[0, .42], [0, -.08]]); ctx.stroke();
        [[-1, -.1], [1, -.22]].forEach(([d, y]) => {
          ctx.save(); ctx.translate(0, y * s); ctx.rotate(d * -0.6);
          ctx.beginPath(); ctx.ellipse(d * .2 * s, 0, .22 * s, .11 * s, 0, 0, 7); fs(acc); ctx.restore();
        });
        P([[-.3, .42], [.3, .42]]); ctx.stroke(); break;
      case 'flag':
        P([[-.24, .44], [-.24, -.44]]); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(-.24 * s, -.42 * s);
        ctx.bezierCurveTo(-.02 * s, -.54 * s, .1 * s, -.28 * s, .38 * s, -.38 * s);
        ctx.lineTo(.38 * s, .02 * s);
        ctx.bezierCurveTo(.1 * s, .12 * s, -.02 * s, -.14 * s, -.24 * s, -.02 * s); ctx.closePath(); fs(acc); break;
      case 'drop':
        ctx.beginPath(); ctx.moveTo(0, -.44 * s);
        ctx.bezierCurveTo(.12 * s, -.2 * s, .34 * s, 0, .34 * s, .14 * s);
        ctx.arc(0, .14 * s, .34 * s, 0, Math.PI);
        ctx.bezierCurveTo(-.34 * s, 0, -.12 * s, -.2 * s, 0, -.44 * s); fs(acc);
        ctx.beginPath(); ctx.arc(0, .14 * s, .2 * s, 2.4, 3.2); ctx.strokeStyle = C.white; ctx.stroke(); break;
      case 'blocks':
        rr(-.4 * s, .12 * s, .5 * s, .28 * s, 4); fs(acc);
        rr(.1 * s, .12 * s, .3 * s, .28 * s, 4); fs(C.white);
        rr(-.25 * s, -.2 * s, .5 * s, .3 * s, 4); fs(acc);
        rr(-.12 * s, -.48 * s, .3 * s, .26 * s, 4); fs(C.white); break;
      case 'target':
        ctx.beginPath(); ctx.arc(0, 0, .42 * s, 0, 7); fs(C.white);
        ctx.beginPath(); ctx.arc(0, 0, .27 * s, 0, 7); fs(acc);
        ctx.beginPath(); ctx.arc(0, 0, .1 * s, 0, 7); fs(C.coral); break;
      case 'shield':
        ctx.beginPath(); ctx.moveTo(0, -.44 * s); ctx.lineTo(.36 * s, -.3 * s); ctx.lineTo(.34 * s, .04 * s);
        ctx.quadraticCurveTo(.3 * s, .32 * s, 0, .46 * s); ctx.quadraticCurveTo(-.3 * s, .32 * s, -.34 * s, .04 * s);
        ctx.lineTo(-.36 * s, -.3 * s); ctx.closePath(); fs(acc);
        P([[-.14, .0], [-.03, .12], [.17, -.12]]); ctx.stroke(); break;
      case 'crate':
        rr(-.4 * s, -.16 * s, .8 * s, .54 * s, 4); fs(acc);
        P([[-.44, -.16], [-.3, -.4], [.3, -.4], [.44, -.16]]); ctx.closePath(); fs(C.white);
        P([[-.12, -.16], [-.12, .38]]); ctx.stroke(); P([[.12, -.16], [.12, .38]]); ctx.stroke(); break;
      case 'sapling':
        P([[0, .42], [0, -.02]]); ctx.stroke();
        ctx.beginPath(); ctx.arc(0, -.16 * s, .26 * s, 0, 7); fs(acc);
        ctx.beginPath(); ctx.arc(.12 * s, -.24 * s, .1 * s, 0, 7); ctx.fillStyle = C.ysoft; ctx.fill();
        P([[-.32, .42], [.32, .42]]); ctx.stroke(); break;
      case 'fork':
        P([[0, .44], [0, .04], [-.3, -.3]]); ctx.stroke();
        P([[0, .04], [.3, -.3]]); ctx.stroke();
        ctx.restore(); ctx.save(); ctx.translate(cx, cy);
        arrowHead(-.3 * s, -.3 * s, -2.3, .13 * s, C.navy);
        arrowHead(.3 * s, -.3 * s, -0.84, .13 * s, C.coral); break;
    }
    ctx.restore();
  }

  // ---------- 鉛筆 ----------
  function pencil(x, y, s, ang = -0.75) {
    ctx.save(); ctx.translate(x, y); ctx.rotate(ang);
    ctx.lineWidth = 4; ctx.strokeStyle = C.navy; ctx.lineJoin = 'round';
    ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(s * .22, -s * .09); ctx.lineTo(s * .22, s * .09); ctx.closePath();
    ctx.fillStyle = C.ysoft; ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(s * .07, -s * .03); ctx.lineTo(s * .07, s * .03); ctx.closePath(); ctx.fillStyle = C.navy; ctx.fill();
    rr(s * .22, -s * .09, s * .62, s * .18, 2); ctx.fillStyle = C.yellow; ctx.fill(); ctx.stroke();
    rr(s * .84, -s * .09, s * .14, s * .18, 4); ctx.fillStyle = C.coral; ctx.fill(); ctx.stroke();
    ctx.restore();
  }

  // ================= 八幕 =================
  const SCENES = [];
  const scene = (start, dur, draw) => SCENES.push({ start, dur, draw });

  // ---------- 01 先問終點 0–7.5 ----------
  const S1_CARDS = ['bag', 'coin', 'chart', 'toolbox'];
  const S1_HOPS = [0.3, 0.95, 1.5, 1.95, 2.32, 2.62, 2.86, 3.06, 3.22, 3.36, 3.48];
  const S1_SEQ = [0, 1, 3, 2, 1, 0, 2, 3, 1, 2, 0];
  const S1_ROUTE = curve([{ x: 250, y: 1400 }, { x: 420, y: 1290 }, { x: 300, y: 1140 }, { x: 560, y: 1080 }, { x: 470, y: 930 }, { x: 760, y: 900 }, { x: 812, y: 822 }]);
  scene(0, 7.5, (lt) => {
    caption(lt, -1, 3.75, [{ t: '先別急著問：', s: 54, w: 700 }, { t: '我要買什麼、', s: 108 }, { t: '投資什麼？', s: 108 }], 250);
    caption(lt, 3.9, null, [{ t: '先算清楚：', s: 54, w: 700 }, { t: '我想過什麼生活？', s: 108, hl: true }], 250);
    T('逆向財務工程｜從目標倒推收入與風險', 110, 1640, { s: 32, w: 700, c: C.mute, a: 1 - seg(lt, 3.5, 3.8) });

    const m = eio(seg(lt, 3.8, 5.0));               // 四張卡合成一張地圖
    const z = lerp(1, 0.9, eio(seg(lt, 3.8, 5.4)));
    ctx.save(); ctx.translate(540, 1130); ctx.scale(z, z); ctx.translate(-540, -1130);
    const pos = (i) => {
      const gx = i % 2, gy = Math.floor(i / 2);
      const bob = Math.sin(lt * 1.7 + i * 1.9) * 7 * (1 - m);
      return { x: lerp(gx ? 750 : 330, gx ? 720 : 360, m), y: lerp(gy ? 1340 : 920, gy ? 1310 : 950, m) + bob };
    };
    // 選擇框在四張卡間跳動，越跳越快
    let k = 0; while (k + 1 < S1_HOPS.length && lt >= S1_HOPS[k + 1]) k++;
    const sel = S1_SEQ[k];
    S1_CARDS.forEach((name, i) => {
      const p = pos(i), on = i === sel && lt < 3.6 ? 1 : 0;
      const sc = 1 + 0.045 * on;
      const sz = lerp(360, 360, m);
      ctx.save(); ctx.translate(p.x, p.y); ctx.scale(sc, sc);
      box(-sz / 2, -sz / 2, sz, sz, lerp(30, 6, m), C.white, { sh: m < 0.95, lw: 4 });
      ctx.globalAlpha *= 1 - seg(lt, 3.8, 4.3);
      icon(name, 0, 0, 170);
      ctx.restore();
    });
    if (lt < 3.75) {
      const from = pos(S1_SEQ[Math.max(0, k - 1)]), to = pos(sel);
      const gap = (S1_HOPS[k + 1] || 4) - S1_HOPS[k];
      const h = k === 0 ? 1 : eo(seg(lt, S1_HOPS[k], S1_HOPS[k] + Math.min(0.2, gap * 0.6)));
      const x = lerp(from.x, to.x, h), y = lerp(from.y, to.y, h);
      ctx.save(); ctx.globalAlpha *= (1 - seg(lt, 3.5, 3.75)) * seg(lt, 0, 0.01 + (k === 0 ? 0 : 0));
      ctx.setLineDash([26, 14]); ctx.lineDashOffset = -lt * 60;
      ctx.lineWidth = 7; ctx.strokeStyle = C.coral; rr(x - 208, y - 208, 416, 416, 40); ctx.stroke();
      ctx.restore();
    }
    // 地圖
    if (m > 0) {
      ctx.save(); ctx.globalAlpha *= m;
      rr(180, 770, 720, 720, 10); ctx.fillStyle = C.white; ctx.fill();
      ctx.save(); rr(180, 770, 720, 720, 10); ctx.clip();
      ctx.strokeStyle = 'rgba(30,42,71,0.07)'; ctx.lineWidth = 2;
      for (let g = 0; g <= 720; g += 60) { ctx.beginPath(); ctx.moveTo(180 + g, 770); ctx.lineTo(180 + g, 1490); ctx.moveTo(180, 770 + g); ctx.lineTo(900, 770 + g); ctx.stroke(); }
      ctx.strokeStyle = 'rgba(30,42,71,0.13)'; ctx.lineWidth = 3;
      [[330, 1250, 1], [700, 1050, 1.3], [430, 900, 0.8]].forEach(([cx, cy, r], j) => {
        for (let ring = 1; ring <= 4; ring++) {
          ctx.beginPath();
          for (let a = 0; a <= 64; a++) {
            const th = a / 64 * Math.PI * 2, rad = ring * 34 * r * (1 + 0.16 * Math.sin(th * 3 + j * 2 + ring));
            const X = cx + Math.cos(th) * rad, Y = cy + Math.sin(th) * rad * 0.8;
            a ? ctx.lineTo(X, Y) : ctx.moveTo(X, Y);
          }
          ctx.stroke();
        }
      });
      ctx.restore();
      ctx.lineWidth = 4; ctx.strokeStyle = C.navy; rr(180, 770, 720, 720, 10); ctx.stroke();
      // 畫到一半的路線（還沒有終點）
      ctx.setLineDash([20, 16]); ctx.lineWidth = 8; ctx.lineCap = 'round'; ctx.strokeStyle = C.line;
      trace(S1_ROUTE, 0, 0.55 * eo(seg(lt, 4.5, 5.6)));
      ctx.setLineDash([]);
      ctx.fillStyle = C.navy; ctx.beginPath(); ctx.arc(250, 1400, 13, 0, 7); ctx.fill();
      ctx.restore();
    }
    // 終點旗子亮起，路線從終點往回畫
    const fk = back(seg(lt, 5.3, 5.8));
    if (fk > 0) {
      const ring = seg(lt, 5.6, 6.8);
      if (ring > 0 && ring < 1) {
        ctx.save(); ctx.globalAlpha *= (1 - ring) * 0.9; ctx.strokeStyle = C.yellow; ctx.lineWidth = 10;
        ctx.beginPath(); ctx.arc(812, 822, 40 + ring * 170, 0, 7); ctx.stroke(); ctx.restore();
      }
      ctx.save(); ctx.translate(812, 822); ctx.scale(fk, fk);

      if (wFlow > 0.5) {
        const P = curve([{ x: cx, y: 780 }, { x: cx, y: 880 }, { x: lerp(cx, 540, 0.7), y: 950 }, { x: lerp(cx, 540, 0.8), y: 1010 }], 16);
        ctx.lineCap = 'round'; ctx.lineWidth = wFlow; ctx.strokeStyle = C.yellow; trace(P, 0, 1);
        ctx.setLineDash([6, 22]); ctx.lineDashOffset = -lt * 120; ctx.lineWidth = Math.max(2, wFlow * 0.25); ctx.strokeStyle = C.white; trace(P, 0, 1); ctx.setLineDash([]);
      }
      ctx.save(); ctx.globalAlpha *= 1 - off; ctx.translate(-off * 260, 0);
      const keep = i > 0 && lt > 4.6 && lt < 6.5 ? 0.5 + 0.5 * Math.sin((lt - 4.6) * 6) : 0;
      box(s.x, 670, s.w, 110, 16, i === 0 ? C.yellow : (keep > 0 ? C.ysoft : C.white));
      icon('blocks', s.x + s.w / 2, 725, i === 0 ? 74 : 56);
      ctx.restore();
    });
    // 現金水箱
    const lvl = 0.78 - 0.34 * eio(seg(lt, 1.6, 3.1)) * (1 - eio(seg(lt, 3.2, 3.7))) - 0.18 * eio(seg(lt, 4.6, 5.8));
    const tx = 240, ty = 1000, twd = 600, th = 300;
    box(tx, ty, twd, th, 24);
    ctx.save(); rr(tx, ty, twd, th, 24); ctx.clip();
    const top = ty + th - lvl * th;
    ctx.beginPath(); ctx.moveTo(tx, ty + th);
    for (let xx = 0; xx <= twd; xx += 12) ctx.lineTo(tx + xx, top + Math.sin(xx * 0.03 + lt * 3.5) * 7);
    ctx.lineTo(tx + twd, ty + th); ctx.closePath(); ctx.fillStyle = C.water; ctx.fill();
    ctx.restore();
    rr(tx, ty, twd, th, 24); ctx.lineWidth = 4; ctx.strokeStyle = C.navy; ctx.stroke();
    for (let m = 1; m < 6; m++) { ctx.beginPath(); ctx.moveTo(tx + twd - 40, ty + m * th / 6); ctx.lineTo(tx + twd - 12, ty + m * th / 6); ctx.lineWidth = 3; ctx.stroke(); }
    ctx.restore();
    // 時鐘：少了兩小時
    const ck = back(seg(lt, 6.8, 7.3));
    if (ck > 0) {
      ctx.save(); ctx.translate(540, 980); ctx.scale(ck, ck);
      box(-170, -170, 340, 340, 170);
      const wedge = eio(seg(lt, 7.4, 8.0));
      if (wedge > 0) { ctx.beginPath(); ctx.moveTo(0, 0); ctx.arc(0, 0, 150, -Math.PI / 2, -Math.PI / 2 + wedge * Math.PI / 3); ctx.closePath(); ctx.fillStyle = C.coral; ctx.globalAlpha *= 0.85; ctx.fill(); ctx.globalAlpha /= 0.85; }
      ctx.lineWidth = 5; ctx.strokeStyle = C.navy; ctx.lineCap = 'round';
      for (let h = 0; h < 12; h++) { const a = h * Math.PI / 6; ctx.beginPath(); ctx.moveTo(Math.cos(a) * 136, Math.sin(a) * 136); ctx.lineTo(Math.cos(a) * 152, Math.sin(a) * 152); ctx.stroke(); }
      const ha = -Math.PI / 2 + lt * 0.5, ma = -Math.PI / 2 + lt * 4;
      ctx.lineWidth = 9; ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(Math.cos(ha) * 80, Math.sin(ha) * 80); ctx.stroke();
      ctx.lineWidth = 6; ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(Math.cos(ma) * 120, Math.sin(ma) * 120); ctx.stroke();
      ctx.fillStyle = C.navy; ctx.beginPath(); ctx.arc(0, 0, 12, 0, 7); ctx.fill();
      ctx.restore();
      // 路線改成更簡單、走得完的版本
      const rk = eio(seg(lt, 8.2, 9.2));
      const pts = ROUTE_A.map((p, i) => ({ x: lerp(p.x, ROUTE_B[i].x, rk), y: lerp(p.y, ROUTE_B[i].y, rk) }));
      const R = curve(pts, 24);
      ctx.save(); ctx.globalAlpha *= eo(seg(lt, 7.2, 7.7));
      ctx.lineWidth = 10; ctx.lineCap = 'round'; ctx.strokeStyle = rk > 0.5 ? C.navy : C.line; ctx.setLineDash(rk > 0.5 ? [] : [20, 16]);
      trace(R, 0, 0.97); ctx.setLineDash([]);
      const e = R[R.length - 1], pe = R[R.length - 6];
      arrowHead(e.x, e.y, Math.atan2(e.y - pe.y, e.x - pe.x), 24, rk > 0.5 ? C.navy : C.line);
      ctx.fillStyle = C.navy; ctx.beginPath(); ctx.arc(170, 1500, 13, 0, 7); ctx.fill();
      ctx.restore();
    }
    foot(lt, 8.6, '壓力測試是規劃工具，不是對未來結果的保證', 1640);
  });

  // ---------- 08 行動收束 65–75 ----------
  const ROWS = [['每月想保留', '元'], ['目前穩定現金流', '元'], ['中間差額', '元'], ['接下來 7 天測試', '']];
  scene(65, 10, (lt) => {
    caption(lt, 0.3, 6.0, [{ t: '今天，就畫一張', s: 88 }, { t: '你的逆向財務地圖', s: 88 }], 260);
    caption(lt, 6.2, null, [{ t: '先寫數字，', s: 88 }, { t: '再選工具。', s: 88 }, { t: '先做小測試，再決定要不要加大投入。', s: 38, w: 500, lh: 1.7, c: C.mute }], 260);
    const push = eio(seg(lt, 4.3, 5.3)) * (1 - eio(seg(lt, 5.9, 6.7)));
    const z = 1 + 0.32 * push;
    ctx.save(); ctx.translate(540, lerp(1060, 1260, push)); ctx.scale(z, z); ctx.translate(-540, -1060 - push * 0);
    const fk = eo(seg(lt, 0.4, 1.0));
    ctx.translate(0, (1 - fk) * 500); ctx.globalAlpha *= fk;
    ctx.save(); ctx.translate(540, 1050); ctx.rotate(-0.018); ctx.translate(-540, -1050);
    box(110, 690, 860, 690, 22);
    ctx.lineWidth = 3; ctx.strokeStyle = C.line; ctx.beginPath(); ctx.moveTo(150, 800); ctx.lineTo(930, 800); ctx.stroke();
    T('我的逆向財務地圖', 150, 770, { s: 46, w: 900 });
    icon('flag', 890, 750, 70);
    ROWS.forEach(([lab, unit], i) => {
      const y = 920 + i * 130;
      const hl = i === 3 ? eio(seg(lt, 4.7, 5.2)) : 0;
      if (hl > 0) { ctx.fillStyle = C.ysoft; ctx.fillRect(130, y - 70, 820 * hl, 104); }
      T(lab, 150, y, { s: 40, w: 700 });
      const x0 = 150 + tw(lab, 40, 700) + 24, x1 = unit ? 860 : 920;
      const k = eio(seg(lt, 1.2 + i * 0.7, 1.75 + i * 0.7));
      ctx.lineWidth = 5; ctx.lineCap = 'round'; ctx.strokeStyle = i === 3 ? C.coral : C.navy;
      if (k > 0) { ctx.beginPath(); ctx.moveTo(x0, y + 12); ctx.lineTo(lerp(x0, x1, k), y + 12); ctx.stroke(); }
      if (unit) T(unit, 880, y, { s: 40, w: 700, a: seg(lt, 1.7 + i * 0.7, 1.9 + i * 0.7) });
      if (k > 0 && k < 1) pencil(lerp(x0, x1, k), y + 8, 150);
    });
    ctx.restore();
    ctx.restore();
    const ek = eo(seg(lt, 6.9, 7.4));
    T('@timzz1208', 110, 1480, { s: 50, w: 700, a: ek });
    T('一般資訊整理，不構成投資、保險或個人化財務建議', 110, 1536, { s: 28, w: 500, c: C.mute, a: ek });
  });

  const DURATION = 75;

  // ---------- 鏡頭：每一幕放在大地圖上的不同位置，換幕時沿路線往回走 ----------
  const POS = SCENES.map((s, i) => ({ x: -i * 1560, y: (i % 2) * 560 }));
  const TR = 0.55;
  function camera(t) {
    for (let i = 0; i < SCENES.length - 1; i++) {
      const B = SCENES[i + 1].start;
      if (Math.abs(t - B) < TR) {
        const m = eio(seg(t, B - TR, B + TR));
        return {
          x: lerp(POS[i].x, POS[i + 1].x, m) + 540, y: lerp(POS[i].y, POS[i + 1].y, m) + 960,
          s: lerp(1.025, 1, m) * (1 - 0.2 * Math.sin(Math.PI * m)), rot: 0.02 * Math.sin(Math.PI * m) * (i % 2 ? 1 : -1)
        };
      }
    }
    let k = 0; while (k + 1 < SCENES.length && t >= SCENES[k + 1].start) k++;
    const S = SCENES[k], lt = t - S.start;
    const drift = k === SCENES.length - 1 ? seg(lt, TR, S.dur) : seg(lt, TR, S.dur - TR);
    return { x: POS[k].x + 540, y: POS[k].y + 960, s: 1 + 0.025 * eio(drift), rot: 0 };
  }

  // 紙紋：一張靜態的圖樣，跟著鏡頭移動
  const paper = (() => {
    const c = document.createElement('canvas'); c.width = c.height = 512;
    const g = c.getContext('2d');
    g.fillStyle = C.paper; g.fillRect(0, 0, 512, 512);
    for (let i = 0; i < 2600; i++) {
      g.fillStyle = `rgba(120,98,60,${0.03 + rand(i) * 0.06})`;
      g.fillRect(rand(i + 0.1) * 512, rand(i + 0.2) * 512, 1 + rand(i + 0.3) * 2, 1 + rand(i + 0.4) * 2);
    }
    g.lineWidth = 1;
    for (let i = 0; i < 140; i++) {
      const x = rand(i + 9) * 512, y = rand(i + 19) * 512, a = rand(i + 29) * 6.28, l = 6 + rand(i + 39) * 22;
      g.strokeStyle = `rgba(140,118,80,${0.06 + rand(i + 49) * 0.08})`;
      g.beginPath(); g.moveTo(x, y); g.quadraticCurveTo(x + Math.cos(a) * l * .5 + 3, y + Math.sin(a) * l * .5 - 3, x + Math.cos(a) * l, y + Math.sin(a) * l); g.stroke();
    }
    return ctx.createPattern(c, 'repeat');
  })();

  function renderAt(t) {
    t = clamp(t, 0, DURATION - 1e-4);
    const cam = camera(t);
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.globalAlpha = 1;
    ctx.translate(540, 960); ctx.rotate(cam.rot); ctx.scale(cam.s, cam.s); ctx.translate(-cam.x, -cam.y);
    const hw = 700 / cam.s, hh = 1100 / cam.s;
    ctx.fillStyle = paper; ctx.fillRect(cam.x - hw, cam.y - hh, hw * 2, hh * 2);
    // 地圖格線
    ctx.strokeStyle = 'rgba(30,42,71,0.05)'; ctx.lineWidth = 2;
    ctx.beginPath();
    for (let x = Math.floor((cam.x - hw) / 120) * 120; x < cam.x + hw; x += 120) { ctx.moveTo(x, cam.y - hh); ctx.lineTo(x, cam.y + hh); }
    for (let y = Math.floor((cam.y - hh) / 120) * 120; y < cam.y + hh; y += 120) { ctx.moveTo(cam.x - hw, y); ctx.lineTo(cam.x + hw, y); }
    ctx.stroke();
    // 幕與幕之間的路線（往左＝往回走）
    for (let i = 0; i < SCENES.length - 1; i++) {
      const A = { x: POS[i].x + 40, y: POS[i].y + 1700 }, B = { x: POS[i + 1].x + 1040, y: POS[i + 1].y + 1700 };
      if (Math.max(A.x, B.x) < cam.x - hw || Math.min(A.x, B.x) > cam.x + hw) continue;
      const R = curve([A, { x: lerp(A.x, B.x, 0.35), y: A.y + 140 }, { x: lerp(A.x, B.x, 0.65), y: B.y - 140 }, B], 24);
      const B0 = SCENES[i + 1].start;
      const p = eio(seg(t, B0 - TR - 0.2, B0 + TR - 0.1));
      const fade = 1 - seg(t, B0 + TR, B0 + TR + 0.5);
      if (p <= 0 || fade <= 0) continue;
      ctx.save(); ctx.globalAlpha *= fade;
      ctx.lineWidth = 9; ctx.lineCap = 'round'; ctx.strokeStyle = C.coral; ctx.setLineDash([2, 24]);
      const tip = trace(R, 0, p);
      ctx.setLineDash([]);
      if (tip && p < 1) arrowHead(tip.x, tip.y, tip.ang, 24, C.coral);
      ctx.restore();
    }
    SCENES.forEach((S, i) => {
      const lt = t - S.start;
      if (lt < -TR - 0.1 || lt > S.dur + TR + 0.1) return;
      ctx.save(); ctx.translate(POS[i].x, POS[i].y);
      S.draw(lt);
      ctx.restore();
    });
  }

  window.renderAt = renderAt;
  window.DURATION = DURATION;

  // ---------- 預覽播放 ----------
  if (Q.has('render')) { document.body.classList.add('render'); renderAt(0); return; }
  const playBtn = document.getElementById('play'), scrub = document.getElementById('scrub'), out = document.getElementById('time');
  let playing = true, t0 = performance.now(), cur = 0;
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (reduce) { playing = false; playBtn.textContent = '播放'; }
  function frame(now) {
    if (playing) { cur = (now - t0) / 1000; if (cur >= DURATION) { cur = DURATION - 0.01; playing = false; playBtn.textContent = '播放'; } }
    renderAt(cur); scrub.value = cur; out.textContent = cur.toFixed(1) + ' 秒';
    requestAnimationFrame(frame);
  }
  playBtn.onclick = () => { playing = !playing; playBtn.textContent = playing ? '暫停' : '播放'; t0 = performance.now() - cur * 1000; };
  document.getElementById('restart').onclick = () => { cur = 0; t0 = performance.now(); playing = true; playBtn.textContent = '暫停'; };
  scrub.oninput = () => { cur = +scrub.value; t0 = performance.now() - cur * 1000; };
  document.fonts.ready.then(() => requestAnimationFrame(frame));
})();
</script>
</body>
